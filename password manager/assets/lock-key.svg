<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 128">
  <defs>
    <style>
      .stroke {
        fill: none;
        stroke: #000;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fill {
        fill: #000;
      }
    </style>
  </defs>

  <!-- Lock body -->
  <rect x="56" y="56" width="80" height="56" rx="10" class="stroke"></rect>

  <!-- Shackle -->
  <path d="M72 56 V40 A24 24 0 0 1 120 40 V56" class="stroke"></path>

  <!-- Keyway -->
  <circle cx="96" cy="82" r="6" class="fill"></circle>
  <rect x="93" y="82" width="6" height="12" class="fill"></rect>

  <!-- Full key -->
  <!-- Key ring -->
  <circle cx="20" cy="80" r="8" class="stroke"></circle>

  <!-- Key shaft -->
  <rect x="28" y="76" width="40" height="8" rx="2" class="stroke"></rect>

  <!-- Key teeth -->
  <rect x="68" y="76" width="8" height="4" class="stroke"></rect>
  <rect x="68" y="80" width="12" height="4" class="stroke"></rect>
</svg>