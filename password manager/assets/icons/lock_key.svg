<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" rx="48" fill="url(#bg)" />

  <!-- Lock body (dark) -->
  <g transform="translate(86,96) scale(0.7)">
    <rect x="48" y="140" width="320" height="220" rx="20" fill="#37474F" />
    <rect x="128" y="60" width="256" height="180" rx="90" fill="none" stroke="#263238" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- key slot (lighter) -->
    <rect x="220" y="240" width="72" height="20" rx="6" fill="#90A4AE" />
  </g>

  <!-- Key (gold) - drawn after lock so it appears on top -->
  <g transform="translate(86,96) scale(0.7)">
    <!-- key head -->
    <circle cx="80" cy="200" r="34" fill="#FFD54F" stroke="#BF360C" stroke-width="6" />
    <!-- key shaft -->
    <rect x="98" y="188" width="220" height="24" rx="6" fill="#FFD54F" stroke="#BF360C" stroke-width="4" />
    <!-- teeth -->
    <rect x="286" y="188" width="18" height="10" fill="#BF360C" />
    <rect x="310" y="188" width="18" height="16" fill="#BF360C" />
    <rect x="334" y="188" width="18" height="8" fill="#BF360C" />
  </g>

  <!-- subtle shadow under key to separate from lock visually -->
  <g transform="translate(86,96) scale(0.7)">
    <ellipse cx="200" cy="218" rx="120" ry="24" fill="#000" opacity="0.06" />
  </g>

</svg>
